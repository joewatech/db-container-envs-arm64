services:
  postgres:
    image: ${POSTGRES_CONTAINER_IMAGE}
    container_name: postgres_18_01
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_SU}
      POSTGRES_PASSWORD: ${POSTGRES_USER_SU_PWD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_LOCAL_PORT}:5432
    expose:
      - 5432
    volumes:
      - ${POSTGRES_LOCAL_DATA_VOL}:/var/lib/postgresql