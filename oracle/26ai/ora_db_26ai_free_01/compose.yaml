services:
  oracledb:
    image: container-registry.oracle.com/database/free:23.26.2.0-arm64
    container_name: ora_db_26ai_free_01
    restart: unless-stopped
    ports:
      - ${ORACLE_PDB_LOCAL_PORT}:1521       # Listener / TNS / SQL*Net
      - ${ORACLE_PDB_LOCAL_OEM_PORT}:5500   # EM Express / APEX (HTTPS) 
    environment:
      ORACLE_PDB: ${ORACLE_PDB}
      ORACLE_PWD: ${ORACLE_PDB_SID_PWD}
      ENABLE_ARCHIVELOG: true
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - ./oradata:/opt/oracle/oradata:U
      - ./scripts/setup:/opt/oracle/scripts/setup
      - ./scripts/startup:/opt/oracle/scripts/startup
 